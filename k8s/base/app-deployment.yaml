apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkjs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkjs-app
  template:
    metadata:
      labels:
        app: mkjs-app
    spec:
      containers:
        - name: app
          image: ghcr.io/felipeacampelo/gces2026-projeto-individual-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "55555"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mkjs-app-secret
                  key: DATABASE_URL
          ports:
            - containerPort: 55555
              name: http
          readinessProbe:
            httpGet:
              path: /api/game-sessions
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/game-sessions
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
