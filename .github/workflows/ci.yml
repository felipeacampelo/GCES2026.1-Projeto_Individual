name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint frontend and backend
        working-directory: server
        run: npm run lint

      - name: Build checks for frontend and backend
        working-directory: server
        run: npm run build

      - name: Run unit tests
        working-directory: server
        run: npm test

      - name: Run fuzzing tests
        working-directory: server
        run: npm run test:fuzz

      - name: Run SCA with npm audit
        working-directory: server
        run: npm run sca
