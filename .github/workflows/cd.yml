name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_IMAGE: ghcr.io/felipeacampelo/gces2026-projeto-individual-app
  NGINX_IMAGE: ghcr.io/felipeacampelo/gces2026-projeto-individual-nginx

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image_name: app
            dockerfile: Dockerfile.prod
            image: ghcr.io/felipeacampelo/gces2026-projeto-individual-app
          - image_name: nginx
            dockerfile: Dockerfile.nginx
            image: ghcr.io/felipeacampelo/gces2026-projeto-individual-nginx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
