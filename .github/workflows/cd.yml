name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_IMAGE: ghcr.io/felipeacampelo/gces2026-projeto-individual-app
  NGINX_IMAGE: ghcr.io/felipeacampelo/gces2026-projeto-individual-nginx

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image_name: app
            dockerfile: Dockerfile.prod
            image: ghcr.io/felipeacampelo/gces2026-projeto-individual-app
          - image_name: nginx
            dockerfile: Dockerfile.nginx
            image: ghcr.io/felipeacampelo/gces2026-projeto-individual-nginx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: publish-images
    permissions:
      contents: read

    env:
      CERT_MANAGER_CLUSTER_ISSUER: letsencrypt-prod
      INGRESS_CLASS_NAME: nginx
      INGRESS_HOST: ${{ vars.K8S_INGRESS_HOST }}
      K8S_NAMESPACE: mkjs
      LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
      POSTGRES_DB: mkjs
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: mkjs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy prerequisites
        id: deploy-check
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          K8S_INGRESS_HOST: ${{ vars.K8S_INGRESS_HOST }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: |
          if [ -n "$KUBE_CONFIG_B64" ] && \
             [ -n "$POSTGRES_PASSWORD" ] && \
             [ -n "$K8S_INGRESS_HOST" ] && \
             [ -n "$LETSENCRYPT_EMAIL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy Kubernetes skipped: configure KUBE_CONFIG_B64, POSTGRES_PASSWORD, K8S_INGRESS_HOST and LETSENCRYPT_EMAIL."
          fi

      - name: Set up kubectl
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_B64}" | base64 --decode > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Create namespace
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply cluster issuer
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: |
          sed \
            -e "s|\${CERT_MANAGER_CLUSTER_ISSUER}|${CERT_MANAGER_CLUSTER_ISSUER}|g" \
            -e "s|\${LETSENCRYPT_EMAIL}|${LETSENCRYPT_EMAIL}|g" \
            -e "s|\${INGRESS_CLASS_NAME}|${INGRESS_CLASS_NAME}|g" \
            k8s/cluster/cluster-issuer.yaml | kubectl apply -f -

      - name: Apply Kubernetes secrets
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: |
          kubectl -n "$K8S_NAMESPACE" create secret generic mkjs-postgres-secret \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$K8S_NAMESPACE" create secret generic mkjs-app-secret \
            --from-literal=DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mkjs-postgres:5432/${POSTGRES_DB}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render production ingress
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: |
          mkdir -p .rendered
          cp -R k8s .rendered/k8s
          sed \
            -e "s|\${CERT_MANAGER_CLUSTER_ISSUER}|${CERT_MANAGER_CLUSTER_ISSUER}|g" \
            -e "s|\${INGRESS_CLASS_NAME}|${INGRESS_CLASS_NAME}|g" \
            -e "s|\${INGRESS_HOST}|${INGRESS_HOST}|g" \
            k8s/overlays/production/ingress.yaml > .rendered/k8s/overlays/production/ingress.yaml

      - name: Deploy manifests
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: kubectl apply -k .rendered/k8s/overlays/production

      - name: Update deployment images
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/mkjs-app app="${APP_IMAGE}:${GITHUB_SHA}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/mkjs-nginx nginx="${NGINX_IMAGE}:${GITHUB_SHA}"

      - name: Wait for rollout
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/mkjs-postgres
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/mkjs-app
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/mkjs-nginx
